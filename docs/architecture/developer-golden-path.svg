<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500"><defs><linearGradient id="b"><stop stop-color="#08172c"/><stop offset="1" stop-color="#173c58"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="none" stroke="#6be0e7" stroke-width="1.5"/></marker><style>.title{font:bold 28px Arial;fill:#fff}.st{font:bold 17px Arial;fill:#fff}.tx{font:14px Arial;fill:#c4d8e8}.node{fill:#163b5b;stroke:#53a1b8;stroke-width:2;rx:15}.arr{stroke:#6be0e7;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs><rect width="1500" height="500" fill="url(#b)"/><text x="55" y="58" class="title">THE DEVELOPER GOLDEN PATH</text><text x="57" y="88" class="tx">Self-service does not mean no controls — guardrails are built into the workflow.</text><g><rect x="55" y="160" width="190" height="125" class="node"/><rect x="285" y="160" width="190" height="125" class="node"/><rect x="515" y="160" width="190" height="125" class="node"/><rect x="745" y="160" width="190" height="125" class="node"/><rect x="975" y="160" width="190" height="125" class="node"/><rect x="1205" y="160" width="240" height="125" class="node"/></g><g class="st" text-anchor="middle"><text x="150" y="201">1. Discover</text><text x="380" y="201">2. Scaffold</text><text x="610" y="201">3. Build &amp; verify</text><text x="840" y="201">4. Publish</text><text x="1070" y="201">5. Deploy</text><text x="1325" y="201">6. Operate</text></g><g class="tx" text-anchor="middle"><text x="150" y="233">Backstage catalogue</text><text x="150" y="256">Team + ownership</text><text x="380" y="233">Golden path template</text><text x="380" y="256">Repo + baseline files</text><text x="610" y="233">Tests • SAST • Trivy</text><text x="610" y="256">SBOM • provenance</text><text x="840" y="233">Amazon ECR</text><text x="840" y="256">Immutable digest</text><text x="1070" y="233">Argo CD + Helm</text><text x="1070" y="256">Policy admission</text><text x="1325" y="233">Metrics • logs • traces</text><text x="1325" y="256">SLO • learn • improve</text></g><path d="M245 222H280M475 222H510M705 222H740M935 222H970M1165 222H1200" class="arr"/><rect x="180" y="345" width="1140" height="90" rx="12" fill="#102a43" stroke="#a77de8" stroke-width="1.5"/><text x="750" y="379" text-anchor="middle" class="st">Guardrails throughout the lifecycle</text><text x="750" y="410" text-anchor="middle" class="tx">Least privilege • approved base images • policy-as-code • secret hygiene • vulnerability thresholds • ownership • rollback</text><text x="55" y="475" class="tx">Illustrative workflow; integrations become operational as milestones are implemented and validated.</text></svg>