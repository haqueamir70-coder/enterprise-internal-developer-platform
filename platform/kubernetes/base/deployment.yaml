apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp-sample-service
  namespace: sample-app
  labels:
    app.kubernetes.io/name: idp-sample-service
    app.kubernetes.io/part-of: enterprise-idp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: idp-sample-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idp-sample-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: idp-sample-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
