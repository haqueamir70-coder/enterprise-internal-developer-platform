apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: python-service-golden-path
  title: Python Service — Secure Golden Path
  description: Scaffold a Python service with ownership metadata and secure defaults.
  tags: [python, kubernetes, devsecops]
spec:
  owner: group:default/platform-team
  type: service
  parameters:
    - title: Service details
      required: [name, owner, description]
      properties:
        name:
          title: Service name
          type: string
          pattern: "^[a-z][a-z0-9-]{2,39}$"
        owner:
          title: Owning team
          type: string
          ui:field: OwnerPicker
        description:
          title: Description
          type: string
  steps:
    - id: log
      name: Review submitted metadata
      action: debug:log
      input:
        message: "Golden path request received. Configure the Backstage GitHub integration and a repository publishing action before enabling automated repository creation."
  output:
    text:
      - title: Integration requirement
        content: Configure Backstage GitHub integration and a repository publishing action before using this template to create repositories.
