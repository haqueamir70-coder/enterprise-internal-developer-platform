apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: idp-sample-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/haqueamir70-coder/enterprise-internal-developer-platform.git
    targetRevision: main
    path: platform/kubernetes/base
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
