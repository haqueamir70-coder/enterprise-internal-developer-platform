name: Repository quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Documentation and manifest checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s docs/DELIVERY-STATUS.md
          test -s docs/security/threat-model.md
          test -s docs/architecture/enterprise-idp-architecture.svg
          test -s docs/architecture/developer-golden-path.svg
          bash scripts/validate-repo.sh
      - name: Validate SVG XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for file in Path("docs/architecture").glob("*.svg"):
              ET.parse(file)
              print(f"Valid SVG XML: {file}")
          PY
      - name: Validate Kubernetes YAML syntax
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import yaml
          from pathlib import Path
          for file in Path("platform").rglob("*.yaml"):
              list(yaml.safe_load_all(file.read_text()))
              print(f"Valid YAML: {file}")
          PY

  sample-container:
    name: Build and smoke-test sample container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and smoke-test
        run: bash scripts/test-sample-service.sh
